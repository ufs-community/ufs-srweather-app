metadata:
  description: |-
    This test checks the capability of the workflow to have the user
    specify a new grid (as opposed to one of the predefined ones in the
    workflow) of ESGgrid type.
user:
  RUN_ENVIR: community
workflow:
  CCPP_PHYS_SUITE: FV3_WoFS_v0
  GRID_GEN_METHOD: ESGgrid
  DATE_FIRST_CYCL: '2017121400'
  DATE_LAST_CYCL: '2017121400'
  FCST_LEN_HRS: 24
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/prep.yaml
    - parm/wflow/coldstart.yaml
task_make_grid:
  ESGgrid_LON_CTR: -118.75
  ESGgrid_LAT_CTR: 34.50
  ESGgrid_DELX: 1000.0
  ESGgrid_DELY: 1000.0
  ESGgrid_NX: 310
  ESGgrid_NY: 300
  ESGgrid_WIDE_HALO_WIDTH: 6
  ESGgrid_PAZI: 0.0
task_get_extrn_ics:
  envvars:
    EXTRN_MDL_NAME_ICS: HRRR
    USE_USER_STAGED_EXTRN_FILES: false
task_get_extrn_lbcs:
  envvars:
    EXTRN_MDL_NAME_LBCS: HRRR
    LBC_SPEC_INTVL_HRS: 1
    USE_USER_STAGED_EXTRN_FILES: false
    EXTRN_MDL_LBCS_MAX_FCST_HRS: 18
    EXTRN_MDL_LBCS_BRIDGE_INTVL_HRS: 6
task_make_ics:
  chgres_cube:
    execution:
      batchargs:
        nodes: 1
        tasks_per_node: 12
task_run_fcst:
  envvars:
    DT_ATMOS: 15
  fv3:
    execution:
      batchargs:
        walltime: "03:00:00"
        nodes: 8
        tasks_per_node: 36
  LAYOUT_X: 14
  LAYOUT_Y: 20
  BLOCKSIZE: 35
  QUILTING: true
  WRTCMP_write_groups: 4
  WRTCMP_write_tasks_per_group: 2
  WRTCMP_output_grid: lambert_conformal
  WRTCMP_cen_lon: !float '{{ task_make_grid.ESGgrid_LON_CTR }}'
  WRTCMP_cen_lat: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_lon_lwr_left: -119.65
  WRTCMP_lat_lwr_left: 34.00
  WRTCMP_stdlat1: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_stdlat2: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_nx: 100
  WRTCMP_ny: 100
  WRTCMP_dx: !float '{{ task_make_grid.ESGgrid_DELX }}'
  WRTCMP_dy: !float '{{ task_make_grid.ESGgrid_DELY }}'
task_run_post:
  envvars:
    POST_OUTPUT_DOMAIN_NAME: custom_ESGgrid_CalFire2017
