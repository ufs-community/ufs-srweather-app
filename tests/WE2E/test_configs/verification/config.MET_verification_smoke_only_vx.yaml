metadata:
  description: |-
    This test checks the capability of the workflow to run verification tasks
    for smoke data (AERONET AOD and AIRNOW PM) using RRFS prototype data.
user:
  RUN_ENVIR: community
workflow:
  CCPP_PHYS_SUITE: FV3_RAP
  DATE_FIRST_CYCL: '2024011100'
  DATE_LAST_CYCL: '2024011100'
  FCST_LEN_HRS: 18
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/verify_pre.yaml
    - parm/wflow/verify_det.yaml
verification:
  VX_FCST_MODEL_NAME: RRFS_smoke_test
  VX_FIELD_GROUPS: [ "SFC", "AOD", "PM25", "PM10", "GOESAOD", "GOESADP"]
  VX_FCST_INPUT_BASEDIR: /lfs6/BMC/gsd-fv3-dev/Michael.Kavulich/smoke_vx/RRFS_retro/staged_data
  FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d%H}'
  FCST_FN_TEMPLATE: 'rrfs.t00z.prslev.f{lead?fmt=%HHH}.grib2'
  NDAS_OBS_DIR: '/mnt/lfs6/BMC/gsd-fv3-dev/Michael.Kavulich/smoke_vx/RRFS_retro/obs_data/ndas'
  AERONET_OBS_DIR: '/mnt/lfs6/BMC/gsd-fv3-dev/Michael.Kavulich/smoke_vx/RRFS_retro/obs_data/aeronet'
  AIRNOW_OBS_DIR: '{{ workflow.EXPTDIR }}/obs_data/airnow'
  GOESAOD_OBS_DIR: '{{ workflow.EXPTDIR }}/obs_data/goesaod'
  VX_TASKS: 4
