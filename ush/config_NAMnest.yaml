metadata:
  description: >-
    Config to run May 2024 NAMnest determinsitic vx

user:
  RUN_ENVIR: community
  MACHINE: hera
  ACCOUNT: fv3lam

nco:
  NET_default: nam

workflow:
  EXPT_SUBDIR: NAMnest
  PREDEF_GRID_NAME: RRFS_CONUS_3km
  DATE_FIRST_CYCL: '2024050100'
  DATE_LAST_CYCL: '2024053100'
  FCST_LEN_HRS: 60
  PREEXISTING_DIR_METHOD: rename

#
# This test assumes that the post-processed forecast files are staged
# (i.e., not generated by running the forecast model).
rocoto:
  tasks:
    taskgroups: '{{ ["parm/wflow/verify_pre.yaml", "parm/wflow/verify_det.yaml"]|include }}'

#task_run_post:
#  POST_OUTPUT_DOMAIN_NAME: conus

#
# Depending on data structure, you may need to add (i.e., take out postprd):
# FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d%H?shift=-${time_lag}}'
# mpasht4nssl_2024050512f13.grib2
verification:
  VX_FCST_MODEL_NAME: NAMnest
  VX_FCST_INPUT_BASEDIR: "/scratch1/BMC/hmtb/harrold/model_data/NAMnest"
  FCST_FN_TEMPLATE: '${NET_default}.t{init?fmt=%H?shift=-${time_lag}}z{% if user.RUN_ENVIR == "nco" and global.DO_ENSEMBLE %}.${ensmem_name}{% endif %}.conusnest.hiresf{lead?fmt=%HH?shift=${time_lag}}.tm00.grib2'
  FCST_SUBDIR_TEMPLATE: '{init?fmt=%Y%m%d%H?shift=-${time_lag}}'
  CCPA_OBS_DIR: "/scratch1/BMC/hmtb/harrold/obs_data/ccpa/proc"
  MRMS_OBS_DIR: "/scratch1/BMC/hmtb/harrold/obs_data/mrms/proc"
  NDAS_OBS_DIR: "/scratch1/BMC/hmtb/harrold/obs_data/ndas/proc"
